# Cudy TR3000 固件自动编译工作流
#
# 思路参考 Kwrt(openwrt.ai) 与 Actions-OpenWrt：
#   官方 OpenWrt 源码 + GitHub Actions 自动构建 + 自动发布 Releases
#
# 一次构建同时产出 4 款固件（128M/256M 标准版与大分区版），
# 大分区(mod)设备定义由 scripts/diy-part1.sh 幂等注入。
# 构建目录位于工作区 openwrt/（runner 磁盘约 150G，清理预装软件后空间充裕）。
name: Build Cudy TR3000 Firmware

on:
  # 手动触发（可勾选是否发布 GitHub Release）
  workflow_dispatch:
    inputs:
      release:
        description: "构建完成后发布到 GitHub Releases"
        type: boolean
        default: true

  # 推送代码自动构建（产物见 Actions Artifacts）
  push:
    branches: [main, master]

  # 每周日 22:30 (UTC) 定时构建并自动发布
  schedule:
    - cron: "30 22 * * 6"

concurrency:
  group: tr3000-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build firmware (OpenWrt 25.12 / mediatek-filogic)
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show system info and free disk space
        # 先打印系统与磁盘信息（便于排查磁盘/内存问题），再清理系统盘预装软件
        # 腾出空间。构建目录放在工作区 openwrt/，完整编译建议 60G+ 可用空间。
        run: |
          echo "=== 系统信息 ==="
          uname -a
          . /etc/os-release && echo "OS: $PRETTY_NAME"
          echo "CPU 核心数: $(nproc)"
          free -h
          echo
          echo "=== 磁盘与分区（清理前） ==="
          lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT
          df -hT
          echo
          echo "=== 清理系统盘预装软件 ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost /usr/lib/jvm
          sudo docker image prune -a -f || true
          sudo -E apt-get -qq purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          echo
          echo "=== 磁盘（清理后） ==="
          df -hT /

      - name: Install host dependencies
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            build-essential clang flex bison g++ gawk bc \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev libelf-dev python3 python3-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt source (openwrt-25.12)
        # 克隆到工作区（构建目录与 dl/ 下载缓存都在这里）
        run: |
          git clone --depth=1 --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Apply diy-part1 (feeds source + device definitions + plugins)
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/scripts/diy-part1.sh"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          # OpenWrt 25.12 采用 apk 打包，版本号中 -rN 后缀只能出现一次。
          # 少数第三方包的 PKG_VERSION 自带 -rN（如 2.1.70-r3）且 PKG_RELEASE 非空，
          # luci.mk 会再拼一次 -rN，生成 2.1.70-r3-r3 这类非法版本号导致 apk 打包失败；
          # 此处将这类包的 PKG_RELEASE 置空（luci.mk 亦注明 PKG_RELEASE MUST be empty）。
          fixed=0
          while IFS= read -r mk; do
            if grep -qE '^PKG_VERSION:=.*-r[0-9]+$' "$mk" && grep -qE '^PKG_RELEASE:=[0-9]+$' "$mk"; then
              sed -i 's/^PKG_RELEASE:=[0-9]*$/PKG_RELEASE:=/' "$mk"
              echo "已修正 apk 版本格式: $mk"
              fixed=$((fixed + 1))
            fi
          done < <(find feeds/kiddin9 -maxdepth 2 -name Makefile 2>/dev/null)
          echo "共修正 ${fixed} 个 Makefile（PKG_RELEASE 置空）"
          # 候选修复：剥离第三方包的 LUCI_EXTRA_DEPENDS 版本约束。apk 体系下
          # EXTRA_DEPENDS 走 package-pack.mk 的版本化依赖路径，与官方 25.12
          # luci.mk 组合时存在包索引丢失风险（luci-app-store 曾因此不在
          # packages.adb 中）；剥离后仅失去最低版本强制（当前源内版本本就
          # 满足约束），不影响功能。
          for pkg in luci-app-store luci-lib-taskd; do
            mk="feeds/kiddin9/${pkg}/Makefile"
            if [ -f "$mk" ] && grep -q '^LUCI_EXTRA_DEPENDS:=.*(' "$mk"; then
              sed -i 's/^LUCI_EXTRA_DEPENDS:=.*/LUCI_EXTRA_DEPENDS:=/' "$mk"
              echo "已剥离 ${pkg} 的 LUCI_EXTRA_DEPENDS 版本约束"
            fi
          done
          # 候选修复：剥离 kiddin9 为 luci-app-store 追加的 @(x86_64||aarch64) 架构条件。
          # 上游 linkease 原版 LUCI_DEPENDS 无此条件（op-packages 仓库自带的
          # .github/diy/patches/luci-app-store.patch 显示 @ 条件系 kiddin9 后加）。
          # 该条件会生成 Kconfig "depends on (x86_64||aarch64)"；26 个校验包中
          # luci-app-store 是唯一带此条件、也是唯一被 Kconfig 剔除的包（passwall2、
          # openclash、oaf 等同为 luasrc+luci.mk 的包均通过），故先消除此独有变量。
          # aarch64 目标下两者行为等价；若剥离后仍被剔除，Verify 的深度诊断会打印真凶。
          mk="feeds/kiddin9/luci-app-store/Makefile"
          if [ -f "$mk" ] && grep -q '^LUCI_DEPENDS:=@(x86_64||aarch64) ' "$mk"; then
            sed -i 's/^LUCI_DEPENDS:=@(x86_64||aarch64) /LUCI_DEPENDS:=/' "$mk"
            echo "已剥离 luci-app-store 的 @(x86_64||aarch64) 架构条件（对齐上游原版）"
          fi
          ./scripts/feeds install -a

      - name: Apply custom files (diy-part2)
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/scripts/diy-part2.sh"

      - name: Load build config
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/configs/tr3000.config" .config
          make defconfig
          for opt in TARGET_MULTI_PROFILE TARGET_PER_DEVICE_ROOTFS; do
            if ! grep -q "CONFIG_${opt}=y" .config; then
              echo "::error::CONFIG_${opt}=y 未生效，无法多设备同时构建"
              exit 1
            fi
          done
          for dev in cudy_tr3000-v1 cudy_tr3000-mod cudy_tr3000-256mb-v1 cudy_tr3000-256mb-mod; do
            if ! grep -q "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${dev}=y" .config; then
              echo "::error::${dev} 未出现在 .config 中，设备定义注入或配置有误"
              echo "--- .config 中的 Target Devices 配置 ---"
              grep "CONFIG_TARGET" .config || true
              exit 1
            fi
            echo "config OK: ${dev}"
          done

      - name: Verify required packages exist
        working-directory: openwrt
        run: |
          # 双重校验：①包在 feeds 元数据中存在；②包确实进入 .config
          # （per-device rootfs 下 DEVICE_PACKAGES 包为 =m，全局包为 =y）。
          # 若②失败说明依赖链断裂被 Kconfig 静默剔除，逐个检查其依赖并
          # 打印缺失项，便于精确定位断点。
          missing=0
          for pkg in \
            luci-theme-argon luci-app-passwall2 xray-core luci-app-openclash \
            luci-app-samba4 luci-app-ksmbd luci-app-vsftpd luci-app-webdav \
            luci-app-linkease luci-app-ttyd luci-app-store luci-app-hd-idle \
            luci-app-netdata luci-app-arpbind luci-app-ddns luci-app-ddns-go \
            luci-app-oaf luci-proto-wireguard wireguard-tools luci-app-softethervpn \
            luci-app-diskman dnsmasq-full kmod-usb-storage kmod-usb-storage-uas \
            block-mount kmod-fs-ext4 kmod-fs-vfat kmod-nls-utf8; do
            if ! grep -q "^Package: ${pkg}$" tmp/.packageinfo; then
              echo "::error::软件包 ${pkg} 不存在，请检查 feeds 与软件源配置"
              missing=1
              continue
            fi
            if ! grep -qE "^CONFIG_PACKAGE_${pkg}=[ym]$" .config; then
              echo "::error::${pkg} 未进入 .config（依赖链断裂被 Kconfig 静默剔除）"
              # 深度诊断 1：.packageinfo 中该包的原始元数据（Depends 实际形态，
              # 含 luci.mk 对 luasrc/ 包自动追加的 +luci-lua-runtime 等）。
              # 旧版用 awk -v RS= + "\n" 正则提取，mawk 下会静默失效，改用 grep -A。
              echo "--- 诊断 1：${pkg} 的 .packageinfo 元数据 ---"
              grep -A 12 "^Package: ${pkg}$" tmp/.packageinfo || true
              # 深度诊断 2：传递依赖闭包 BFS——从 .packageinfo 逐层展开依赖，
              # 打印所有不存在的包（含依赖它的上游包名），彻底定位断点。
              echo "--- 诊断 2：传递依赖闭包 BFS（缺失项 = 依赖链断点）---"
              declare -A p_seen=( ["${pkg}"]=1 )
              p_queue=( "${pkg}" )
              while [ "${#p_queue[@]}" -gt 0 ]; do
                p_cur="${p_queue[0]}"
                p_queue=( "${p_queue[@]:1}" )
                p_deps=$(grep -A 12 "^Package: ${p_cur}$" tmp/.packageinfo | sed -n 's/^Depends: //p')
                for d in $(echo "${p_deps}" | tr ' ,' '  '); do
                  d=${d%%(*}
                  case "$d" in @*|"") continue ;; esac
                  d=${d#+}
                  case "$d" in *:*) d="${d##*:}" ;; esac
                  [ -n "${d}" ] || continue
                  [ -z "${p_seen[${d}]:-}" ] || continue
                  p_seen["${d}"]=1
                  if grep -q "^Package: ${d}$" tmp/.packageinfo; then
                    p_queue=( "${p_queue[@]}" "${d}" )
                  else
                    echo "  -> 依赖缺失: ${d}（被 ${p_cur} 依赖）"
                  fi
                done
              done
              # 深度诊断 3：Kconfig 实际生成的 config 块（depends on / select 全集）。
              # 注意：生成的 config 行带 tab 前缀，旧版 ^config 锚定永远漏检
              # （假阴性），改用无锚定子串匹配；文件为 tmp/.config-package.in。
              echo "--- 诊断 3：Kconfig 实际生成的 config 块 ---"
              kcfg="tmp/.config-package.in"
              if [ -f "${kcfg}" ] && grep -q "config PACKAGE_${pkg}\$" "${kcfg}"; then
                sed -n "/config PACKAGE_${pkg}\$/,/^\$/p" "${kcfg}" | head -80
              else
                echo "  (${kcfg} 中不存在 config PACKAGE_${pkg} 块)"
                grep -rl "config PACKAGE_${pkg}\$" tmp/ 2>/dev/null || true
              fi
              # 深度诊断 3b：本包 vs 对照包 passwall2（共用闭包核心且存活）的
              # depends on 行对比。select 目标的 dir_dep 为 no 时会被 kconfig
              # 强制剔除，这里直接暴露被传递继承的假依赖表达式。
              echo "--- 诊断 3b：本包 vs passwall2 的 depends on 行 ---"
              for p2 in "${pkg}" luci-app-passwall2; do
                echo "[${p2}]"
                if [ -f "${kcfg}" ]; then
                  sed -n "/config PACKAGE_${p2}\$/,/^\$/p" "${kcfg}" | grep "depends on" || echo "  (无 depends on 行)"
                fi
              done
              # 深度诊断 3c：本包完整 stanza + 闭包独有成员 stanza（核对 CI
              # 上的实际 Depends 形态与本地取证是否一致）。
              echo "--- 诊断 3c：本包完整 stanza + 闭包独有成员 stanza ---"
              grep -A 30 "^Package: ${pkg}\$" tmp/.packageinfo || true
              for p2 in luci-lib-taskd luci-lib-xterm taskd tar mount-utils procd liblua ubus ubox libudebug libjson-c jshn curl libuci-lua coreutils coreutils-stty script-utils libblobmsg-json; do
                echo "[${p2}]"
                grep -A 4 "^Package: ${p2}\$" tmp/.packageinfo || true
              done
              # 深度诊断 4：关键符号在 .config 中的实际值（架构符号、拉力链与
              # 完整传递闭包）。旧版以 ^...= 锚定只看 =y/=m，会漏掉被连带
              # 剔除的 "# CONFIG_x is not set" 形态；改用无锚定子串匹配
              # （=|空格），并覆盖 store 全部依赖闭包成员——断点在哪层一目了然。
              echo "--- 诊断 4：关键符号在 .config 中的实际值 ---"
              grep -E "CONFIG_(aarch64|x86_64|arm|TARGET_mediatek|TARGET_mediatek_filogic|TARGET_PER_DEVICE_ROOTFS|TARGET_MULTI_PROFILE|MODULES|DEFAULT_luci-app-store|MODULE_DEFAULT_luci-app-store|PACKAGE_luci-app-store|PACKAGE_luci-lua-runtime|PACKAGE_luci-lib-taskd|PACKAGE_luci-lib-xterm|PACKAGE_taskd|PACKAGE_tar|PACKAGE_curl|PACKAGE_libuci-lua|PACKAGE_liblua|PACKAGE_libuci|PACKAGE_mount-utils|PACKAGE_libmount|PACKAGE_libsmartcols|PACKAGE_libblkid|PACKAGE_libuuid|PACKAGE_procd|PACKAGE_ubus|PACKAGE_ubox|PACKAGE_libubox|PACKAGE_libjson-c|PACKAGE_jshn|PACKAGE_script-utils|PACKAGE_coreutils|PACKAGE_coreutils-stty)(=| )" .config || true
              # 深度诊断 6：自动化根因定位——本包 Kconfig 块每条 depends on 行
              # 逐行求值（提取符号名查其在 .config 的实际值），直接点出假条件。
              # tar 在 .config 中零行（非 "is not set"，而是无行）是重大异常：
              # tar 是 store 的直接依赖（+tar），其依赖会经 mconf_depends 递归
              # 展开为本包的 depends on 行；同时 dump tar 块与 tar 链符号快照。
              echo "--- 诊断 6：本包块 depends on 行逐行求值 ---"
              if [ -f "${kcfg}" ]; then
                sed -n "/config PACKAGE_${pkg}\$/,/^\$/p" "${kcfg}" | sed -n 's/^[[:space:]]*depends on //p' | while IFS= read -r dc_line; do
                  printf '  条件[%s] => ' "${dc_line}"
                  dc_refs=""
                  for dc_s in $(echo "${dc_line}" | grep -oE '[A-Za-z_][A-Za-z0-9_-]*' | sort -u); do
                    case "${dc_s}" in y|m|n) continue ;; esac
                    dc_v=$(grep -m1 -E "^(# )?CONFIG_${dc_s}(=| )" .config | head -1)
                    dc_refs="${dc_refs}${dc_s}{${dc_v:-未定义}}; "
                  done
                  echo "${dc_refs}"
                done || true
              fi
              echo "--- 诊断 6b：tar 的 Kconfig 块 + tar 依赖链符号快照 ---"
              sed -n "/config PACKAGE_tar\$/,/^\$/p" "${kcfg}" 2>/dev/null | head -40 || true
              grep -E "CONFIG_(PACKAGE_(tar|bzip2|libbz2|libacl|libattr|libzstd|libstdcpp|xz|liblzma)|PACKAGE_TAR_[A-Z0-9_]+|USE_FS_ACL_ATTR)(=| )" .config || true
              # 深度诊断 5：重跑 defconfig 捕获 kconfig 原生警告——select 目标
              # 的 dir_dep 为 no 时 kconfig 会打印 "unmet direct dependencies"
              # 并直接给出导致剔除的依赖表达式（最终定锤证据）。
              echo "--- 诊断 5：kconfig 警告（重跑 make defconfig）---"
              make defconfig > /tmp/dc-rerun.log 2>&1 || true
              wc -l /tmp/dc-rerun.log || true
              grep -n -i -B2 -A12 "unmet\|warning\|luci-app-store" /tmp/dc-rerun.log | head -150 || true
              tail -15 /tmp/dc-rerun.log || true
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if grep -q "CONFIG_PACKAGE_dnsmasq=y" .config; then
            echo "::error::dnsmasq 与 dnsmasq-full 冲突（dnsmasq 仍被选中）"
            exit 1
          fi
          for mk in luci-lib-linkeasefile luci-app-linkease; do
            if grep -qE '^PKG_RELEASE:=[0-9]+$' "package/feeds/kiddin9/${mk}/Makefile" 2>/dev/null; then
              echo "::error::${mk} 的 apk 版本格式修正未生效（PKG_RELEASE 非空）"
              exit 1
            fi
          done
          if grep -q '^LUCI_DEPENDS:=@(x86_64||aarch64)' "package/feeds/kiddin9/luci-app-store/Makefile" 2>/dev/null; then
            echo "::error::luci-app-store 的 @(x86_64||aarch64) 架构条件剥离未生效"
            exit 1
          fi
          echo "校验通过：全部必需软件包均可用且已进入 .config，apk 版本修正已生效"

      - name: Download package sources
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s

      - name: Compile firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware
        run: |
          # 先确认 kiddin9 关键包的编译产物已生成（区分"未编译"与"包索引缺失"）
          for f in luci-app-store luci-lib-taskd taskd luci-lib-xterm; do
            if ! find bin/packages -name "${f}-*" 2>/dev/null | grep -q .; then
              echo "::error::${f} 的编译产物缺失（bin/packages 下未找到）"
              find bin/packages -maxdepth 2 -type d 2>/dev/null || true
              exit 1
            fi
          done
          mkdir -p artifacts
          cp openwrt/bin/targets/mediatek/filogic/*cudy_tr3000*sysupgrade.bin artifacts/
          cp openwrt/bin/targets/mediatek/filogic/sha256sums artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/filogic/profiles.json artifacts/ 2>/dev/null || true
          (cd artifacts && sha256sum -- *.bin > SHA256SUMS.txt)
          ls -lh artifacts
          echo "=== 构建后磁盘占用 ==="
          df -hT /
          {
            echo "## 构建产物"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in artifacts/*.bin; do
              printf "| %s | %s |\n" "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cudy-tr3000-firmware-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-24.04
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: cudy-tr3000-firmware-${{ github.run_number }}
          path: artifacts

      - name: Generate release tag
        id: tag
        run: echo "tag=tr3000-$(date -u +%Y%m%d)-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Cudy TR3000 固件 ${{ steps.tag.outputs.tag }}"
          body: |
            基于官方 OpenWrt **openwrt-25.12** 稳定分支自动编译。

            | 固件 | 设备名 | 分区方案 | 内置 |
            |---|---|---|---|
            | 128M 标准版 | cudy_tr3000-v1 | 原厂布局（ubi 64M），官方过渡固件后 sysupgrade | 主题 |
            | 128M 大分区版 | cudy_tr3000-mod | U-Boot mod，ubi 112M（mod-112m 方案） | 主题 + 18 款插件 |
            | 256M 标准版 | cudy_tr3000-256mb-v1 | 原厂布局（ubi 230M），官方过渡固件后 sysupgrade | 主题 + 18 款插件 |
            | 256M 大分区版 | cudy_tr3000-256mb-mod | U-Boot mod，ubi 240M | 主题 + 18 款插件 |

            - 默认主题：Argon（4 款固件均内置）
            - 内置插件（仅大分区版与 256M 标准版）：PassWall2（含 xray-core）、OpenClash、Samba4、
              ksmbd、vsftpd、WebDAV、LinkEase、ttyd 网页终端、iStore、hd-idle、netdata、arpbind、
              DDNS / DDNS-Go、oaf 应用过滤、WireGuard、SoftEther VPN、DiskMan

            > 刷机前请阅读仓库 README 的刷机说明并备份原机分区（尤其 FIP），风险自负。
          files: |
            artifacts/*.bin
            artifacts/SHA256SUMS.txt
            artifacts/profiles.json
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
